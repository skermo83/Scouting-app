<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crop Scout</title>
  <meta name="description" content="GPS crop scouting for weeds, pests and diseases with voice entry and field reports.">
  <meta name="theme-color" content="#1f3d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crop Scout">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🌾 Crop Scout</div>
    <div class="status">
      <span id="gpsPill" class="pill pill-off">GPS…</span>
      <span id="fieldPill" class="pill pill-field">No field</span>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button data-tab="scout" class="active"><span>📍</span>Scout</button>
    <button data-tab="fields"><span>🗺️</span>Fields</button>
    <button data-tab="records"><span>📋</span>Records</button>
    <button data-tab="report"><span>📤</span>Report</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="printArea" class="print-area"></div>
</body>
</html>
